<div id="messages"></div>
<input id="msg" placeholder="Message" />
<button onclick="send()">Send</button>

<script>
    const room = "chat123";
    let connectionId;

    const es = new EventSource("http://localhost:5000/quickstart/connect");
    es.addEventListener("connected", e => {
        connectionId = JSON.parse(e.data).connectionId;
        fetch(`http://localhost:5000/quickstart/join?connectionId=${connectionId}&room=${room}`, { method: "POST" });
    });
    es.addEventListener(room, e => {
        document.getElementById("messages").innerHTML += `<p>${JSON.parse(e.data).message}</p>`;
    });

    function send() {
        fetch(`http://localhost:5000/quickstart/send?room=${room}&message=${document.getElementById("msg").value}`, { method: "POST" });
    }
</script>
